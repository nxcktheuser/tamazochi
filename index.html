<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wasteland Home</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;touch-action:none;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#e8ecef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d10}
#wrap{position:relative;overflow:hidden}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#txt{position:absolute;left:0;top:0;pointer-events:none}
#hud{position:absolute;top:0;left:0;right:0;padding:6px 8px 14px;background:linear-gradient(#000c,#0000);pointer-events:none;font-size:11px;line-height:1.35}
.hr{display:flex;justify-content:space-between;font-weight:600;margin-bottom:3px}
.hb{display:flex;gap:4px;margin-bottom:3px}
.hb i{flex:1;height:6px;background:#0008;border-radius:3px;overflow:hidden;display:block}
.hb u{display:block;height:100%}
.hres{opacity:.9;font-size:10.5px}
#hint{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:11px;color:#fffa;pointer-events:none;text-shadow:0 1px 2px #000}
#bar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px;background:linear-gradient(#0000,#000c)}
.btn,button{background:#252d35;color:#e8ecef;border:0;border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:active,button:active{transform:scale(.97)}
button.p{background:#7ed957;color:#10200a;font-weight:700}
button:disabled{opacity:.4}
#bar button{flex:1;background:#252d35ee;border:1px solid #3a444d}
#shade{position:absolute;inset:0;background:#0007;display:none;z-index:15}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:#1c2228;border-radius:16px 16px 0 0;padding:12px 12px 16px;transform:translateY(105%);transition:transform .22s;z-index:20;font-size:13px;touch-action:pan-y}
#sheet.open{transform:none}
#sheet h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:6px}
.sub{color:#8b97a1;font-size:12px;margin-bottom:8px;line-height:1.4}
.x{position:absolute;right:10px;top:8px;padding:4px 9px;background:#252d35}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #252d35}
.it:last-child{border:0}
.it small{display:block;color:#8b97a1;margin-top:2px}
.it button{padding:7px 10px;font-size:12px;white-space:nowrap}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#252d35;color:#8b97a1;font-weight:400}
.bar{margin:6px 0}.bar b{display:flex;justify-content:space-between;font-size:12px;color:#8b97a1;font-weight:500;margin-bottom:2px}
.bar i{display:block;height:8px;background:#252d35;border-radius:5px;overflow:hidden}.bar u{display:block;height:100%}
.tabs{display:flex;gap:6px;overflow:auto;margin:6px 0}.tabs button{white-space:nowrap;padding:6px 10px;font-size:12px}.tabs button.on{background:#7ed957;color:#10200a}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #fff4;vertical-align:-2px;margin-right:6px}
.log{font-size:12.5px;line-height:1.55;color:#aab4bc}.log .w{color:#7ed957}.log .l{color:#e5534b}.log .y{color:#e3b341}
input{width:100%;background:#252d35;border:1px solid #3a444d;border-radius:8px;color:#fff;padding:9px;font-size:14px;margin:6px 0}
#toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:#000c;padding:7px 13px;border-radius:10px;font-size:12px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="root"><div id="wrap">
  <canvas id="game"></canvas>
  <canvas id="txt"></canvas>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="bar"></div>
  <div id="shade" onclick="closeSheet()"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div></div>

<script>
/* ============ CONFIG / TELEGRAM ============ */
const SAVE_KEY='wasteland_home_v2';
const TG=window.Telegram&&Telegram.WebApp;
if(TG){TG.ready();TG.expand();try{TG.disableVerticalSwipes()}catch(e){}try{TG.setHeaderColor('#0b0d10');TG.setBackgroundColor('#0b0d10')}catch(e){}}
const TG_USER=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;

/* ============ UTIL ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dk(h,f){const n=parseInt(h.slice(1),16);return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>clamp(Math.round(v*f),0,255).toString(16).padStart(2,'0')).join('')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1700)}
function haptic(){try{TG.HapticFeedback.impactOccurred('light')}catch(e){}}

/* ============ DATA ============ */
const LOOKS=[
 {n:'Разведчик',perk:'📡 Вылазки на 10% дешевле по энергии',jacket:'#5b6b3a',scarf:'#3a3d44',hair:'#7a4a28',pack:'#4a5230',pants:'#4a4f5a',head:'goggles',hat:'#4a4338'},
 {n:'Медик',perk:'➕ Аптечки лечат на 20 HP больше',jacket:'#cdbfa5',scarf:'#8a7a6a',hair:'#3a2a25',pack:'#5a4636',pants:'#6a5a4a',head:'medic',hat:'#cdbfa5'},
 {n:'Механик',perk:'🔧 +1 лом с каждой вылазки',jacket:'#c08a2c',scarf:'#a8432f',hair:'#e3b341',pack:'#7a5a30',pants:'#4a5a78',head:'cap',hat:'#3a3d46'},
 {n:'Сталкер',perk:'☢️ +2 к защите',jacket:'#5c6b3a',scarf:'#5c6b3a',hair:'#2a2420',pack:'#2a2c30',pants:'#3a3228',head:'mask',hat:'#5c6b3a'},
 {n:'Садовник',perk:'🌱 Огород и сбор воды дают +25%',jacket:'#5f8a3f',scarf:'#c9a064',hair:'#b0522a',pack:'#8a6038',pants:'#6a5a3a',head:'beanie',hat:'#d8c19a'},
 {n:'Волчонок',perk:'🐺 +2 к атаке',jacket:'#5a4a44',scarf:'#e0d4bc',hair:'#2a2220',pack:'#4a3a30',pants:'#4a4a50',head:'wolf',hat:'#b8a890'},
];
const WEAPONS=[
 {id:'fists',n:'Кулаки',atk:1,t:0},{id:'bat',n:'Бита',atk:4,t:1},{id:'pistol',n:'Пистолет',atk:7,t:2},
 {id:'shotgun',n:'Дробовик',atk:11,t:3},{id:'rifle',n:'Автомат',atk:16,t:4}];
const ARMORS=[
 {id:'rags',n:'Лохмотья',def:0,t:0,col:'#7a6a5a'},{id:'jacket',n:'Кожанка',def:1,t:1,col:'#4a3426'},
 {id:'vest',n:'Бронежилет',def:3,t:2,col:'#4a5560'},{id:'plate',n:'Пластины',def:5,t:3,col:'#6a6f78'},
 {id:'swat',n:'Броня SWAT',def:8,t:4,col:'#2f3640'}];
const RES={food:'🍖 Еда',water:'💧 Вода',scrap:'🔩 Лом',meds:'💊 Аптечки',parts:'⚙️ Детали'};
const SELL={food:2,water:2,scrap:1,meds:6,parts:4};
const SHELTER=[
 {id:'garden',n:'Огород',i:'🥕',desc:'Выращивает еду (до 8 часов копится)',base:{scrap:10},max:5},
 {id:'rain',n:'Сбор дождя',i:'🌧',desc:'Накапливает воду',base:{scrap:10},max:5},
 {id:'work',n:'Мастерская',i:'🛠',desc:'Производит лом, открывает крафт',base:{scrap:15},max:5},
 {id:'bunk',n:'Кровать',i:'🛏',desc:'Чем лучше кровать — тем быстрее восстанавливается энергия',base:{scrap:12},max:5},
 {id:'wall',n:'Стена',i:'🧱',desc:'Каждый уровень даёт +1 к защите в вылазках',base:{scrap:20,parts:2},max:5},
];
const DISTRICTS=[
 {id:'sub',n:'Окраина',lvl:1,y0:0,y1:155,b:[
  {id:'garage',n:'Гараж',k:'garage',x:62,y:70,d:1,e:10,loot:{scrap:[2,5],parts:[0,1]},gt:1},
  {id:'shop',n:'Магазинчик',k:'shop',x:225,y:62,d:2,e:12,loot:{food:[2,5],water:[1,4]},gt:1},
  {id:'pharm',n:'Аптека',k:'pharm',x:60,y:122,d:3,e:14,loot:{meds:[1,3],water:[0,2]},gt:2}]},
 {id:'cen',n:'Центр',lvl:3,y0:155,y1:332,b:[
  {id:'mart',n:'Супермаркет',k:'mart',x:62,y:210,d:4,e:16,loot:{food:[5,10],water:[4,8]},gt:2},
  {id:'police',n:'Участок',k:'police',x:200,y:250,d:5,e:18,loot:{scrap:[3,6],parts:[1,3]},gt:3},
  {id:'hosp',n:'Больница',k:'hosp',x:105,y:292,d:6,e:20,loot:{meds:[3,6],parts:[1,2]},gt:3}]},
 {id:'ind',n:'Промзона',lvl:5,y0:332,y1:460,b:[
  {id:'ware',n:'Склад',k:'ware',x:40,y:385,d:7,e:22,loot:{scrap:[8,14],parts:[2,4]},gt:3},
  {id:'fact',n:'Завод',k:'fact',x:200,y:385,d:9,e:25,loot:{scrap:[10,18],parts:[3,6]},gt:4},
  {id:'base',n:'Воен. база',k:'base',x:250,y:435,d:11,e:30,loot:{meds:[3,6],parts:[4,8],scrap:[8,12]},gt:4}]},
];
const POIS=[];DISTRICTS.forEach(d=>d.b.forEach(b=>{b.dist=d;POIS.push(b)}));
const HOME={x:118,y:18};

const DECO={
 wall:{n:'Стены',items:[{id:'w0',n:'Бетон',c:'#3c4249',caps:0,pts:0},{id:'w1',n:'Кирпич',c:'#6b3f36',caps:25,pts:10},{id:'w2',n:'Хвоя',c:'#2f4a3c',caps:25,pts:10},{id:'w3',n:'Ночь',c:'#2d3e57',caps:40,pts:20},{id:'w4',n:'Охра',c:'#7a6a3a',caps:40,pts:20}]},
 floor:{n:'Пол',items:[{id:'f0',n:'Бетон',c:'#2a2f35',caps:0,pts:0},{id:'f1',n:'Паркет',c:'#7a5530',caps:30,pts:10},{id:'f2',n:'Плитка',c:'#9aa0a6',caps:40,pts:20},{id:'f3',n:'Металл',c:'#4f565e',caps:35,pts:15}]},
 poster:{n:'Постеры',items:[{id:'p0',n:'Без постера',caps:0,pts:0},{id:'p1',n:'Карта',caps:15,pts:5},{id:'p2',n:'Закат',caps:20,pts:10},{id:'p3',n:'Череп',caps:25,pts:10},{id:'p4',n:'Флаг',caps:30,pts:15}]},
 rug:{n:'Ковры',items:[{id:'r0',n:'Без ковра',caps:0,pts:0},{id:'r1',n:'Красный',c:'#8a2e2e',caps:20,pts:5},{id:'r2',n:'Зелёный',c:'#3a6a3a',caps:20,pts:5},{id:'r3',n:'Полосатый',c:'#c9a040',caps:35,pts:15}]},
 lamp:{n:'Свет',items:[{id:'l0',n:'Лампочка',c:'#ffe9a0',caps:0,pts:0},{id:'l1',n:'Неон',c:'#4ee0e0',caps:40,pts:20},{id:'l2',n:'Фонарь',c:'#ffb347',caps:30,pts:10}]},
 plant:{n:'Растения',items:[{id:'n0',n:'Без растения',caps:0,pts:0},{id:'n1',n:'Кактус',caps:15,pts:5},{id:'n2',n:'Папоротник',caps:20,pts:10}]},
};
const DITEM={};for(const k in DECO)DECO[k].items.forEach(i=>{i.cat=k;DITEM[i.id]=i});
const DEF_DECO=()=>({wall:'w0',floor:'f0',poster:'p0',rug:'r0',lamp:'l0',plant:'n0'});

/* ============ STATE ============ */
function fresh(){const n=Date.now();return{
 v:2,t:n,look:null,name:TG_USER?TG_USER.first_name:'Выживший',
 sat:80,thr:80,en:100,hp:100,lvl:1,xp:0,caps:30,pts:0,
 res:{food:6,water:6,scrap:10,meds:2,parts:0},
 sh:{garden:0,rain:0,work:0,bunk:0,wall:0},
 col:{food:n,water:n,scrap:n},
 gear:{weapons:['fists'],armors:['rags'],w:'fists',a:'rags'},
 deco:{sh:DEF_DECO(),st:DEF_DECO()},
 owned:['w0','f0','p0','r0','l0','n0'],
 raids:0,kills:0}}
let S=fresh(),sleeping=false;
const maxHp=()=>100+(S.lvl-1)*10;
const WP=()=>WEAPONS.find(x=>x.id===S.gear.w);
const AR=()=>ARMORS.find(x=>x.id===S.gear.a);
const atk=()=>WP().atk+S.lvl+(S.look===5?2:0);
const def=()=>AR().def+S.sh.wall+(S.look===3?2:0);

function save(){S.t=Date.now();const s=JSON.stringify(S);try{localStorage.setItem(SAVE_KEY,s)}catch(e){}
 if(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')){try{TG.CloudStorage.setItem(SAVE_KEY,s)}catch(e){}}}
function load(cb){let local=null;try{local=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){}
 const fin=cloud=>{let b=local;if(cloud&&(!b||cloud.t>b.t))b=cloud;if(b){S=Object.assign(fresh(),b);S.deco=Object.assign({sh:DEF_DECO(),st:DEF_DECO()},b.deco||{})}cb()};
 if(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')){try{TG.CloudStorage.getItem(SAVE_KEY,(e,v)=>{let c=null;try{c=JSON.parse(v)}catch(x){}fin(c)});return}catch(e){}}
 fin(null)}

function tick(m){if(m<=0)return;
 if(sleeping){S.en=clamp(S.en+m*(2+S.sh.bunk*.8),0,100);S.sat=clamp(S.sat-m*.08,0,100);S.thr=clamp(S.thr-m*.1,0,100);if(S.en>=100){sleeping=false;toast('Выспался 😴')}}
 else{S.sat=clamp(S.sat-m*.15,0,100);S.thr=clamp(S.thr-m*.2,0,100);S.en=clamp(S.en+m*.05,0,100)}
 if(S.sat<=0||S.thr<=0)S.hp=clamp(S.hp-m*.5,0,maxHp());else if(S.sat>40&&S.thr>40)S.hp=clamp(S.hp+m*.1,0,maxHp())}
function offline(){tick(Math.min((Date.now()-S.t)/60000,480))}
setInterval(()=>{tick(5/60);save();updHud()},5000);

/* ============ ECONOMY ============ */
const canPay=c=>Object.keys(c).every(k=>(k==='caps'||k==='pts'?S[k]:S.res[k])>=c[k]);
const pay=c=>{for(const k in c){if(k==='caps'||k==='pts')S[k]-=c[k];else S.res[k]-=c[k]}};
const costStr=c=>Object.keys(c).filter(k=>c[k]).map(k=>(k==='caps'?'💰':k==='pts'?'⭐':RES[k].split(' ')[0])+c[k]).join(' ');
function shCost(b){const l=S.sh[b.id],o={};for(const k in b.base)o[k]=Math.ceil(b.base[k]*Math.pow(1.7,l));return o}
function pend(k){const l={food:S.sh.garden,water:S.sh.rain,scrap:S.sh.work}[k];const m={food:3,water:3,scrap:2}[k];
 const h=Math.min((Date.now()-S.col[k])/3600000,8);return Math.floor(h*l*m*((S.look===4&&k!=='scrap')?1.25:1))}
function collectOne(k){const n=pend(k);if(n<1)return toast('Пока пусто');S.res[k]+=n;S.col[k]=Date.now();fx(CH.x,CH.y-40,'+'+n+' '+RES[k].split(' ')[0],'#7ed957');haptic();save();refresh()}
function upg(id){const b=SHELTER.find(x=>x.id===id),c=shCost(b);if(!canPay(c)||S.sh[id]>=b.max)return;
 for(const k of['food','water','scrap']){const n=pend(k);if(n>0){S.res[k]+=n}S.col[k]=Date.now()}
 pay(c);S.sh[id]++;haptic();toast(b.n+' → ур.'+S.sh[id]);save();refresh()}
function act(a){haptic();
 if(S.hp<=0&&a!=='heal')return toast('Сначала аптечка 💊');
 if(a==='feed'){if(S.res.food<1)return toast('Нет еды');S.res.food--;S.sat=clamp(S.sat+25,0,100)}
 if(a==='drink'){if(S.res.water<1)return toast('Нет воды');S.res.water--;S.thr=clamp(S.thr+30,0,100)}
 if(a==='heal'){if(S.res.meds<1)return toast('Нет аптечек');S.res.meds--;S.hp=clamp(S.hp+40+(S.look===1?20:0),1,maxHp())}
 if(a==='sleep'){sleeping=!sleeping;if(sleeping){CH.floor=0;CH.y=floorY(0);CH.path=[];if(scene!=='shelter')setScene('shelter')}else{CH.x=100}}
 save();refresh()}
function equip(k,id){if(k==='w')S.gear.w=id;else S.gear.a=id;haptic();save();refresh()}
function craftCost(x){return{scrap:x.t*12,parts:x.t*3}}
function craft(k,id){const x=(k==='w'?WEAPONS:ARMORS).find(z=>z.id===id),c=craftCost(x);if(!canPay(c))return toast('Не хватает ресурсов');
 pay(c);(k==='w'?S.gear.weapons:S.gear.armors).push(id);toast('Скрафтил: '+x.n);save();refresh()}
function sell(k){const n=Math.min(5,S.res[k]);if(n<1)return;S.res[k]-=n;S.caps+=n*SELL[k];fx(90,200,'+'+n*SELL[k]+'💰','#e3b341');haptic();save();refresh()}
function dcost(i){return{caps:i.caps,pts:i.pts}}
function setDeco(id){S.deco[scene==='storage'?'st':'sh'][DITEM[id].cat]=id;haptic();save();refresh()}
function buyDeco(id){const i=DITEM[id],c=dcost(i);if(!canPay(c))return toast('Не хватает 💰/⭐');pay(c);S.owned.push(id);setDeco(id)}

/* ============ RAID ============ */
function raidCost(b){return Math.ceil(b.e*(S.look===0?.9:1))}
function doRaid(b){
 S.en-=raidCost(b);S.raids++;
 const log=[`<b>${b.n}</b>`];
 const zc=b.d+rnd(1,3);let hp=S.hp,dead=false,kills=0;
 for(let z=0;z<zc&&!dead;z++){let zh=4+b.d*2;
  while(zh>0&&hp>0){zh-=atk()+rnd(0,3);if(zh>0)hp-=Math.max(1,b.d+rnd(0,2)-def())}
  if(hp>0)kills++;else dead=true}
 S.kills+=kills;const dmg=S.hp-Math.max(hp,0);S.hp=Math.max(hp,0);
 log.push(`Убито: ${kills}/${zc} · урон −${Math.round(dmg)} HP`);
 if(dead){S.hp=1;log.push('<span class="l">💀 Тебя чуть не прикончили. Еле дополз домой, добыча потеряна.</span>')}
 else{
  const got=[];
  for(const k in b.loot){const n=rnd(b.loot[k][0],b.loot[k][1])+(k==='scrap'?(S.look===2?1:0)+Math.floor(S.sh.work/2):0);if(n>0){S.res[k]+=n;got.push(RES[k].split(' ')[0]+n)}}
  const caps=rnd(1,3)*b.d,pts=b.d*4+kills;S.caps+=caps;S.pts+=pts;got.push('💰'+caps);got.push('⭐'+pts);
  log.push('<span class="w">Лут: '+got.join(' ')+'</span>');
  if(Math.random()<.18+b.d*.02){
   const isW=Math.random()<.5,t=Math.min(b.gt,rnd(Math.max(1,b.gt-1),b.gt));
   const it=(isW?WEAPONS:ARMORS).find(x=>x.t===t);
   if(it){const have=isW?S.gear.weapons:S.gear.armors;
    if(!have.includes(it.id)){have.push(it.id);log.push(`<span class="y">✨ Нашёл: ${it.n}! (смотри на складе)</span>`)}else{S.res.scrap+=5;log.push('Дубликат снаряжения → +5 🔩')}}}
  const xp=b.d*5;S.xp+=xp;log.push('+'+xp+' XP');
  while(S.xp>=S.lvl*30){S.xp-=S.lvl*30;S.lvl++;S.hp=maxHp();log.push(`<span class="y">⬆️ Уровень ${S.lvl}!</span>`)}
 }
 save();return log}

/* ============ CANVAS ============ */
const VW=180,VH=320,WW=300,WH=460;

 ctx.restore();
 if(flash>0){ctx.globalAlpha=Math.min(.5,flash);R(0,0,VW,VH,'#e5534b');ctx.globalAlpha=1;flash-=dt}}

/* ============ SHEETS ============ */
let cur=null;
function openS(fn,...a){cur={fn,a};$('sheet').innerHTML='<button class="x" onclick="closeSheet()">✕</button>'+fn(...a);$('sheet').classList.add('open');$('shade').style.display='block'}
function closeSheet(){cur=null;$('sheet').classList.remove('open');$('shade').style.display='none'}
function refresh(){updHud();if(cur){const sc=$('sheet').scrollTop;$('sheet').innerHTML='<button class="x" onclick="closeSheet()">✕</button>'+cur.fn(...cur.a);$('sheet').scrollTop=sc}}
const bar=(l,v,m,c)=>`<div class="bar"><b><span>${l}</span><span>${Math.round(v)}/${m}</span></b><i><u style="width:${clamp(v/m*100,0,100)}%;background:${c}"></u></i></div>`;

function shNeeds(){const L=LOOKS[S.look];
 return `<h3>🧍 Персонаж</h3><div class="sub">${S.name} · ${L.n} · ур.${S.lvl}<br>${L.perk}</div>
 ${bar('❤️ Здоровье',S.hp,maxHp(),'#e5534b')}${bar('🍖 Сытость',S.sat,100,'#e3b341')}${bar('💧 Жажда',S.thr,100,'#58a6ff')}${bar('⚡ Энергия',S.en,100,'#7ed957')}${bar('⭐ Опыт',S.xp,S.lvl*30,'#b88cff')}
 <div class="g2"><button onclick="act('feed')">🍖 Покормить (${S.res.food})</button><button onclick="act('drink')">💧 Напоить (${S.res.water})</button>
 <button onclick="act('heal')">💊 Лечить (${S.res.meds})</button><button onclick="act('sleep');closeSheet()">${sleeping?'⏰ Встать':'😴 Спать'}</button></div>
 <div class="sub">⚔️ Атака ${atk()} · 🛡 Защита ${def()} · Вылазок: ${S.raids} · Убито: ${S.kills}</div>`}
function craftList(){
 const l=[...WEAPONS.map(x=>['w',x]),...ARMORS.map(x=>['a',x])].filter(([k,x])=>x.t>0&&x.t<=S.sh.work+1&&!(k==='w'?S.gear.weapons:S.gear.armors).includes(x.id));
 return `<h3 style="margin-top:12px">🔨 Крафт</h3>`+(S.sh.work<1?'<div class="sub">Улучши мастерскую, чтобы крафтить.</div>':l.length?l.map(([k,x])=>`<div class="it"><div>${x.n}<small>${k==='w'?'Атака +'+x.atk:'Защита +'+x.def}</small></div><button ${canPay(craftCost(x))?'':'disabled'} onclick="craft('${k}','${x.id}')">${costStr(craftCost(x))}</button></div>`).join(''):'<div class="sub">Всё доступное скрафчено. Улучши мастерскую.</div>')}
function shBuilding(id){const b=SHELTER.find(x=>x.id===id),l=S.sh[id],c=shCost(b),maxed=l>=b.max;
 const pk={garden:'food',rain:'water',work:'scrap'}[id];
 let h=`<h3>${b.i} ${b.n} <span class="tag">ур.${l}/${b.max}</span></h3><div class="sub">${b.desc}${id==='wall'?'. Сейчас: +'+l+' 🛡':''}</div>`;
 if(pk)h+=`<button class="p" style="width:100%;margin-bottom:8px" ${pend(pk)<1?'disabled':''} onclick="collectOne('${pk}')">Собрать ${RES[pk]}: ${pend(pk)}</button>`;
 if(id==='bunk')h+=`<button style="width:100%;margin-bottom:8px" onclick="act('sleep');closeSheet()">${sleeping?'⏰ Встать':'😴 Лечь спать'}</button>`;
 h+=`<button style="width:100%" ${maxed||!canPay(c)?'disabled':''} onclick="upg('${id}')">${maxed?'Максимальный уровень':'⬆️ Улучшить: '+costStr(c)}</button>`;
 if(id==='work')h+=craftList();return h}
function shPOI(id){const b=POIS.find(x=>x.id===id),ec=raidCost(b),ok=S.en>=ec&&S.hp>0;
 return `<h3>${b.n}</h3><div class="sub">${b.dist.n} · опасность ${'💀'.repeat(Math.min(5,Math.ceil(b.d/2.2)))} · ⚡ ${ec}</div>
 <div class="sub">Можно найти: ${Object.keys(b.loot).map(k=>RES[k]).join(', ')}, 💰 крышки, ⭐ очки; иногда оружие или броню.</div>
 ${bar('❤️',S.hp,maxHp(),'#e5534b')}${bar('⚡',S.en,100,'#7ed957')}<div class="sub">⚔️ ${atk()} · 🛡 ${def()}</div>
 <button class="p" style="width:100%" ${ok?'':'disabled'} onclick="startRaid('${id}')">${S.hp<=0?'Нужна аптечка':S.en<ec?'Мало энергии':'🚶 Выйти на вылазку'}</button>`}
function shReport(log){return `<h3>📋 Отчёт</h3><div class="log">${log.join('<br>')}</div><button class="p" style="width:100%;margin-top:10px" onclick="closeSheet()">Продолжить</button>`}
function startRaid(id){const b=POIS.find(x=>x.id===id);closeSheet();const L=Math.hypot(b.x-HOME.x,b.y-HOME.y);RA={b,t:0,dur:Math.max(1.4,L/60),px:HOME.x,py:HOME.y,done:false};$('hint').textContent=''}
function shStock(){return `<h3>📦 Склад</h3><div class="sub">Излишки можно продать за 💰</div>`+Object.keys(RES).map(k=>`<div class="it"><div>${RES[k]}: <b>${S.res[k]}</b><small>${SELL[k]} 💰 за штуку</small></div><button ${S.res[k]<1?'disabled':''} onclick="sell('${k}')">Продать ${Math.min(5,S.res[k])}</button></div>`).join('')}
function shWard(){return `<h3>👕 Шкаф с бронёй</h3><div class="sub">Защита: ${def()}</div>`+ARMORS.map(a=>{const h=S.gear.armors.includes(a.id);return `<div class="it"><div><span class="sw" style="background:${a.col}"></span>${h?a.n:'???'}<small>${h?'Защита +'+a.def:'Найди в вылазках или скрафти'}</small></div>${h?`<button class="${S.gear.a===a.id?'p':''}" onclick="equip('a','${a.id}')">${S.gear.a===a.id?'Надето':'Надеть'}</button>`:''}</div>`}).join('')}
function shRack(){return `<h3>🔫 Оружие</h3><div class="sub">Атака: ${atk()}</div>`+WEAPONS.map(a=>{const h=S.gear.weapons.includes(a.id);return `<div class="it"><div>${h?a.n:'???'}<small>${h?'Атака +'+a.atk:'Найди в вылазках или скрафти'}</small></div>${h?`<button class="${S.gear.w===a.id?'p':''}" onclick="equip('w','${a.id}')">${S.gear.w===a.id?'В руках':'Взять'}</button>`:''}</div>`}).join('')}
function shDeco(cat){cat=cat||'wall';const cs=scene==='storage'?'st':'sh';
 return `<h3>🎨 Декор · ${scene==='storage'?'склад':'убежище'}</h3><div class="sub">💰 ${S.caps} · ⭐ ${S.pts}. Крышки и очки приходят с вылазок.</div>
 <div class="tabs">${Object.keys(DECO).map(k=>`<button class="${k===cat?'on':''}" onclick="openS(shDeco,'${k}')">${DECO[k].n}</button>`).join('')}</div>`+
 DECO[cat].items.map(i=>{const own=S.owned.includes(i.id),on=S.deco[cs][cat]===i.id,c=dcost(i);
  return `<div class="it"><div>${i.c?`<span class="sw" style="background:${i.c}"></span>`:''}${i.n}</div>${own?`<button class="${on?'p':''}" ${on?'disabled':''} onclick="setDeco('${i.id}')">${on?'✓ Выбрано':'Выбрать'}</button>`:`<button ${canPay(c)?'':'disabled'} onclick="buyDeco('${i.id}')">${costStr(c)}</button>`}</div>`}).join('')}
function shLook(i){const L=LOOKS[i];return `<h3>${L.n}</h3><div class="sub">${L.perk}</div><div class="sub">Имя персонажа:</div><input id="nm" maxlength="16" value="${(S.name||'').replace(/"/g,'')}"><button class="p" style="width:100%" onclick="startGame(${i})">Начать игру</button>`}
function startGame(i){const v=($('nm').value||'').trim();S.look=i;S.name=v||'Выживший';closeSheet();CH.x=60;CH.y=floorY(0);CH.floor=0;save();setScene('shelter');haptic()}

/* ============ SCENE CONTROL / HUD ============ */
function setScene(s){scene=s;closeSheet();
 const bar=$('bar');
 if(s==='shelter')bar.innerHTML='<button onclick="openS(shDeco)">🎨 Декор</button><button onclick="openS(shNeeds)">🧍 Персонаж</button>';
 else if(s==='storage')bar.innerHTML='<button onclick="setScene(\'shelter\')">← Убежище</button><button onclick="openS(shDeco)">🎨 Декор</button><button onclick="openS(shNeeds)">🧍 Персонаж</button>';
 else if(s==='city')bar.innerHTML='<button onclick="setScene(\'shelter\')">🏠 В убежище</button><button onclick="openS(shNeeds)">🧍 Персонаж</button>';
 else bar.innerHTML='';
 $('hint').textContent=s==='city'?'Тащи карту · тапни здание, чтобы идти в вылазку':'';
 if(s==='city'){if(!cityCv)buildCity();cam.x=60;cam.y=0}
 updHud()}
function updHud(){const h=$('hud');if(scene==='select'){h.innerHTML='';return}
 h.innerHTML=`<div class="hr"><span>${S.name} · ур.${S.lvl}</span><span>💰 ${S.caps} &nbsp;⭐ ${S.pts}</span></div>
 <div class="hb"><i><u style="width:${S.hp/maxHp()*100}%;background:#e5534b"></u></i><i><u style="width:${S.sat}%;background:#e3b341"></u></i><i><u style="width:${S.thr}%;background:#58a6ff"></u></i><i><u style="width:${S.en}%;background:#7ed957"></u></i></div>
 <div class="hres">🍖${S.res.food} 💧${S.res.water} 🔩${S.res.scrap} 💊${S.res.meds} ⚙️${S.res.parts}</div>`}

/* ============ INPUT ============ */
let ptr=null;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(x){}ptr={x0:e.clientX,y0:e.clientY,cx:cam.x,cy:cam.y,moved:false}});
cv.addEventListener('pointermove',e=>{if(!ptr)return;const dx=e.clientX-ptr.x0,dy=e.clientY-ptr.y0;if(Math.abs(dx)+Math.abs(dy)>6)ptr.moved=true;
 if(scene==='city'&&ptr.moved&&!RA){cam.x=clamp(ptr.cx-dx/SC,0,WW-VW);cam.y=clamp(ptr.cy-dy/SC,0,WH-VH)}});
cv.addEventListener('pointerup',e=>{if(!ptr)return;const p=ptr;ptr=null;if(p.moved)return;const r=cv.getBoundingClientRect();tap((e.clientX-r.left)/SC,(e.clientY-r.top)/SC)});
function tap(x,y){if(cur)return;haptic();
 if(scene==='city'){if(RA)return;const wx=x+Math.round(cam.x),wy=y+Math.round(cam.y);
  for(const b of POIS)if(Math.abs(wx-b.x)<=14&&wy>=b.y-30&&wy<=b.y+16){if(S.lvl<b.dist.lvl)return toast('Район закрыт: нужен уровень '+b.dist.lvl);return openS(shPOI,b.id)}return}
 let hit=null;for(let i=HS.length-1;i>=0;i--){const h=HS[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){hit=h.id;break}}
 if(!hit)return;
 if(scene==='select'&&hit.startsWith('look'))return openS(shLook,+hit.slice(4));
 if(scene==='shelter'){
  if(hit==='gate')return setScene('city');
  if(hit==='wall')return openS(shBuilding,'wall');
  if(hit==='storage')return setScene('storage');
  if(hit==='char'||hit==='table')return openS(shNeeds);
  if(['poster','rug','lamp','plant'].includes(hit))return openS(shDeco,hit);
  const room={bunk:[0,140],garden:[1,60],rain:[1,110],work:[2,60]}[hit];
  if(room){if(!sleeping)goTo(room[0],room[1]);openS(shBuilding,{bunk:'bunk',garden:'garden',rain:'rain',work:'work'}[hit])}}
 else if(scene==='storage'){
  if(hit==='ward')return openS(shWard);if(hit==='rack')return openS(shRack);if(hit==='stock')return openS(shStock);
  if(hit==='char')return openS(shNeeds);if(['poster','rug','lamp','plant'].includes(hit))return openS(shDeco,hit)}}

/* ============ LOOP ============ */
let last=performance.now();
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;time+=dt;
 for(const z of SZ){z.x+=z.d*dt*4;if(z.x<4||z.x>170)z.d*=-1}
 updChar(dt);ctx.imageSmoothingEnabled=false;
 if(scene==='select')drawSelect();else if(scene==='shelter')drawShelter();else if(scene==='storage')drawStorage();else if(scene==='city')drawCity(dt);
 drawFX(dt);flushText();requestAnimationFrame(frame)}

load(()=>{offline();CH.y=floorY(0);CH.x=60;if(S.look==null)setScene('select');else setScene('shelter');updHud();requestAnimationFrame(frame)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){offline();S.t=Date.now();updHud()}});
</script>
</body>
</html>
