<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wasteland Home</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;touch-action:none;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#e8ecef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d10}
#wrap{position:relative;overflow:hidden}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#txt{position:absolute;left:0;top:0;pointer-events:none}
#hud{position:absolute;top:0;left:0;right:0;padding:6px 8px 14px;background:linear-gradient(#000c,#0000);pointer-events:none;font-size:11px;line-height:1.35}
.hr{display:flex;justify-content:space-between;font-weight:600;margin-bottom:3px}
.hb{display:flex;gap:4px;margin-bottom:3px}
.hb i{flex:1;height:6px;background:#0008;border-radius:3px;overflow:hidden;display:block}
.hb u{display:block;height:100%}
.hres{opacity:.9;font-size:10.5px}
#hint{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:11px;color:#fffa;pointer-events:none;text-shadow:0 1px 2px #000}
#bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000a);pointer-events:none}
#bar button{pointer-events:auto}
.btn,button{background:#1f252a;color:#e8ecef;border:2px solid #353c42;border-radius:6px;padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 2px 0 #05070a}
.btn:active,button:active{transform:scale(.97)}
button.p{background:#d8a93a;border-color:#f0cf7a;color:#1a1204;font-weight:700}
button:disabled{opacity:.4}
#bar button.nb{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;background:#14181cf0;border:2px solid #3a4046;border-radius:6px;box-shadow:inset 0 0 0 1px #0008,0 3px 0 #05070a;font:700 9.5px/1 -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#c9cfd3}
#bar button.nb span{font-size:24px;line-height:1;filter:drop-shadow(0 2px 0 #000a)}
#bar button.nb:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px #0008,0 1px 0 #05070a}
#bar button.nb.hot{border-color:#d8a93a;color:#f0cf7a}
#bar button.nb.dev{flex:0 0 46px;justify-content:center}
#shade{position:absolute;inset:0;background:#05070acc;display:none;z-index:15}
#sheet{position:absolute;left:50%;top:50%;width:min(94%,360px);max-height:84%;overflow:auto;background:#12161a;border:2px solid #4a4f46;border-radius:8px;box-shadow:0 0 0 2px #05070a,0 12px 40px #000c,inset 0 0 0 1px #0009;padding:0 12px 14px;transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:transform .16s ease-out,opacity .16s;z-index:20;font-size:13px;touch-action:pan-y}
#sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#sheet::-webkit-scrollbar{width:0}
#sheet::before{content:"";display:block;height:8px;margin:0 -12px 10px;background:repeating-linear-gradient(-45deg,#d8a93a 0 8px,#15120a 8px 16px);border-bottom:2px solid #05070a}
#sheet h3{margin:0 0 6px;padding-right:34px;font:800 15px/1.2 -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:#f0e6c8}
.sub{color:#8f9a92;font-size:12px;margin-bottom:8px;line-height:1.4}
.x{position:sticky;float:right;top:0;margin:-2px -4px 0 0;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;background:#2a1d18;border-color:#8a4a2a;color:#f0b080;z-index:2}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #252d35}
.it:last-child{border:0}
.it small{display:block;color:#8b97a1;margin-top:2px}
.it button{padding:7px 10px;font-size:12px;white-space:nowrap}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#252d35;color:#8b97a1;font-weight:400}
.bar{margin:6px 0}.bar b{display:flex;justify-content:space-between;font-size:12px;color:#8b97a1;font-weight:500;margin-bottom:2px}
.bar i{display:block;height:10px;background:#0b0e11;border:2px solid #2c333a;border-radius:3px;overflow:hidden;position:relative}.bar u{display:block;height:100%}.bar i::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 7px,#0b0e11 7px 9px)}
.tabs{display:flex;gap:6px;overflow:auto;margin:6px 0}.tabs button{white-space:nowrap;padding:6px 10px;font-size:12px}.tabs button.on{background:#d8a93a;border-color:#f0cf7a;color:#1a1204}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #fff4;vertical-align:-2px;margin-right:6px}
.log{font-size:12.5px;line-height:1.55;color:#aab4bc}.log .w{color:#9fc86a}.log .l{color:#e5534b}.log .y{color:#e3b341}
input{width:100%;background:#252d35;border:1px solid #3a444d;border-radius:8px;color:#fff;padding:9px;font-size:14px;margin:6px 0}
#hud .hb{gap:3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
button.lk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:11px}
button.lk img{height:92px;max-width:100%;object-fit:contain}
button.lk.p{outline:2px solid #d8a93a}
img.ic{width:14px;height:14px;vertical-align:-3px;margin:0 2px 0 0;image-rendering:pixelated;pointer-events:none}
/* карточка героя */
.hc{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.pt{flex:0 0 68px;height:68px;border:2px solid #d8a93a;border-radius:6px;background:#0b0e11 center top/cover no-repeat;image-rendering:pixelated;box-shadow:inset 0 0 0 2px #05070a}
.hc b{display:block;font:800 18px/1.1 -apple-system,Segoe UI,Roboto,sans-serif;color:#f0e6c8}
.hc .tag{background:#d8a93a;color:#1a1204;font-weight:700}
.hc .sub{margin:4px 0 0}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.acts button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 7px;font:700 10px/1.1 -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.04em;text-transform:uppercase;background:#171c20}
.acts button img.ic{width:26px;height:26px}
.acts button em{position:absolute;top:-6px;right:-4px;min-width:18px;padding:1px 4px;border-radius:9px;background:#d8a93a;color:#1a1204;font:700 10px/14px sans-serif;font-style:normal}
.acts button:disabled em{background:#555}
.row2{display:flex;gap:6px}.row2 button{flex:1}
.foot{display:flex;justify-content:space-between;gap:6px;margin-top:10px;padding-top:8px;border-top:2px solid #232a30;color:#8f9a92;font-size:11px}
.foot b{color:#e8ecef;font-weight:600}
#toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:#000c;padding:7px 13px;border-radius:10px;font-size:12px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="root"><div id="wrap">
  <canvas id="game"></canvas>
  <canvas id="txt"></canvas>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="bar"></div>
  <div id="shade" onclick="closeSheet()"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div></div>

<script>
/* ============ CONFIG / TELEGRAM ============ */
const SAVE_KEY='wasteland_home_v2';
const TG=window.Telegram&&Telegram.WebApp;
if(TG){TG.ready();TG.expand();try{TG.disableVerticalSwipes()}catch(e){}try{TG.setHeaderColor('#0b0d10');TG.setBackgroundColor('#0b0d10')}catch(e){}}
const TG_USER=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;

/* ============ UTIL ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dk(h,f){const n=parseInt(h.slice(1),16);return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>clamp(Math.round(v*f),0,255).toString(16).padStart(2,'0')).join('')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1700)}
function haptic(){try{TG.HapticFeedback.impactOccurred('light')}catch(e){}}

/* ============ DATA ============ */
const LOOKS=[
 {n:'Разведчик',perk:'📡 Вылазки на 10% дешевле по энергии',jacket:'#5b6b3a',scarf:'#3a3d44',hair:'#7a4a28',pack:'#4a5230',pants:'#4a4f5a',head:'goggles',hat:'#4a4338'},
 {n:'Медик',perk:'➕ Аптечки лечат на 20 HP больше',jacket:'#cdbfa5',scarf:'#8a7a6a',hair:'#3a2a25',pack:'#5a4636',pants:'#6a5a4a',head:'medic',hat:'#cdbfa5'},
 {n:'Механик',perk:'🔧 +1 лом с каждой вылазки',jacket:'#c08a2c',scarf:'#a8432f',hair:'#e3b341',pack:'#7a5a30',pants:'#4a5a78',head:'cap',hat:'#3a3d46'},
 {n:'Сталкер',perk:'☢️ +2 к защите',jacket:'#5c6b3a',scarf:'#5c6b3a',hair:'#2a2420',pack:'#2a2c30',pants:'#3a3228',head:'mask',hat:'#5c6b3a'},
 {n:'Садовник',perk:'🌱 Огород и сбор воды дают +25%',jacket:'#5f8a3f',scarf:'#c9a064',hair:'#b0522a',pack:'#8a6038',pants:'#6a5a3a',head:'beanie',hat:'#d8c19a'},
 {n:'Волчонок',perk:'🐺 +2 к атаке',jacket:'#5a4a44',scarf:'#e0d4bc',hair:'#2a2220',pack:'#4a3a30',pants:'#4a4a50',head:'wolf',hat:'#b8a890'},
];
const WEAPONS=[
 {id:'fists',n:'Кулаки',atk:1,t:0},{id:'bat',n:'Бита',atk:4,t:1},{id:'pistol',n:'Пистолет',atk:7,t:2},
 {id:'shotgun',n:'Дробовик',atk:11,t:3},{id:'rifle',n:'Автомат',atk:16,t:4}];
const ARMORS=[
 {id:'rags',n:'Лохмотья',def:0,t:0,col:'#7a6a5a'},{id:'jacket',n:'Кожанка',def:1,t:1,col:'#4a3426'},
 {id:'vest',n:'Бронежилет',def:3,t:2,col:'#4a5560'},{id:'plate',n:'Пластины',def:5,t:3,col:'#6a6f78'},
 {id:'swat',n:'Броня SWAT',def:8,t:4,col:'#2f3640'}];
const ic=n=>'<img class="ic" src="assets/icons/icon_'+n+'.png" alt="">';
const RES={food:'Еда',water:'Вода',scrap:'Лом',meds:'Аптечки',parts:'Детали'};
const RESIC={food:'food',water:'water',scrap:'scrap',meds:'medkit',parts:'parts'};
const RESE={food:'🍖',water:'💧',scrap:'🔩',meds:'💊',parts:'⚙️'};
const rI=k=>ic(RESIC[k]),rN=k=>rI(k)+' '+RES[k];
const SELL={food:2,water:2,scrap:1,meds:6,parts:4};
const SHELTER=[
 {id:'garden',n:'Огород',i:'🥕',desc:'Выращивает еду (до 8 часов копится)',base:{scrap:10},max:5},
 {id:'rain',n:'Сбор дождя',i:'🌧',desc:'Накапливает воду',base:{scrap:10},max:5},
 {id:'work',n:'Мастерская',i:'🛠',desc:'Производит лом, открывает крафт',base:{scrap:15},max:5},
 {id:'bunk',n:'Кровать',i:'🛏',desc:'Чем лучше кровать — тем быстрее восстанавливается энергия',base:{scrap:12},max:5},
 {id:'wall',n:'Стена',i:'🧱',desc:'Каждый уровень даёт +1 к защите в вылазках',base:{scrap:20,parts:2},max:5},
];
const DISTRICTS=[
 {id:'sub',n:'Окраина',lvl:1,y0:0,y1:143,b:[
  {id:'garage',n:'Гараж',k:'garage',x:201,y:46,d:1,e:10,loot:{scrap:[2,5],parts:[0,1]},gt:1},
  {id:'shop',n:'Магазинчик',k:'shop',x:90,y:121,d:2,e:12,loot:{food:[2,5],water:[1,4]},gt:1},
  {id:'pharm',n:'Аптека',k:'pharm',x:179,y:121,d:3,e:14,loot:{meds:[1,3],water:[0,2]},gt:2}]},
 {id:'cen',n:'Центр',lvl:3,y0:143,y1:334,b:[
  {id:'mart',n:'Супермаркет',k:'mart',x:70,y:232,d:4,e:16,loot:{food:[5,10],water:[4,8]},gt:2},
  {id:'police',n:'Участок',k:'police',x:73,y:314,d:5,e:18,loot:{scrap:[3,6],parts:[1,3]},gt:3},
  {id:'hosp',n:'Больница',k:'hosp',x:201,y:238,d:6,e:20,loot:{meds:[3,6],parts:[1,2]},gt:3}]},
 {id:'ind',n:'Промзона',lvl:5,y0:334,y1:484,b:[
  {id:'ware',n:'Склад',k:'ware',x:56,y:411,d:7,e:22,loot:{scrap:[8,14],parts:[2,4]},gt:3},
  {id:'fact',n:'Завод',k:'fact',x:218,y:416,d:9,e:25,loot:{scrap:[10,18],parts:[3,6]},gt:4},
  {id:'base',n:'Воен. база',k:'base',x:218,y:469,d:11,e:30,loot:{meds:[3,6],parts:[4,8],scrap:[8,12]},gt:4}]},
];
const POIS=[];DISTRICTS.forEach(d=>d.b.forEach(b=>{b.dist=d;POIS.push(b)}));
const HOME={x:135,y:26};

const DECO={
 wall:{n:'Стены',items:[{id:'w0',n:'Бетон',c:'#3c4249',caps:0,pts:0},{id:'w1',n:'Кирпич',c:'#6b3f36',caps:25,pts:10},{id:'w2',n:'Хвоя',c:'#2f4a3c',caps:25,pts:10},{id:'w3',n:'Ночь',c:'#2d3e57',caps:40,pts:20},{id:'w4',n:'Охра',c:'#7a6a3a',caps:40,pts:20}]},
 floor:{n:'Пол',items:[{id:'f0',n:'Бетон',c:'#2a2f35',caps:0,pts:0},{id:'f1',n:'Паркет',c:'#7a5530',caps:30,pts:10},{id:'f2',n:'Плитка',c:'#9aa0a6',caps:40,pts:20},{id:'f3',n:'Металл',c:'#4f565e',caps:35,pts:15}]},
 poster:{n:'Постеры',items:[{id:'p0',n:'Без постера',caps:0,pts:0},{id:'p1',n:'Карта',caps:15,pts:5},{id:'p2',n:'Закат',caps:20,pts:10},{id:'p3',n:'Череп',caps:25,pts:10},{id:'p4',n:'Флаг',caps:30,pts:15}]},
 rug:{n:'Ковры',items:[{id:'r0',n:'Без ковра',caps:0,pts:0},{id:'r1',n:'Красный',c:'#8a2e2e',caps:20,pts:5},{id:'r2',n:'Зелёный',c:'#3a6a3a',caps:20,pts:5},{id:'r3',n:'Полосатый',c:'#c9a040',caps:35,pts:15}]},
 lamp:{n:'Свет',items:[{id:'l0',n:'Лампочка',c:'#ffe9a0',caps:0,pts:0},{id:'l1',n:'Неон',c:'#4ee0e0',caps:40,pts:20},{id:'l2',n:'Фонарь',c:'#ffb347',caps:30,pts:10}]},
 plant:{n:'Растения',items:[{id:'n0',n:'Без растения',caps:0,pts:0},{id:'n1',n:'Кактус',caps:15,pts:5},{id:'n2',n:'Папоротник',caps:20,pts:10}]},
};
const DITEM={};for(const k in DECO)DECO[k].items.forEach(i=>{i.cat=k;DITEM[i.id]=i});
const DEF_DECO=()=>({wall:'w0',floor:'f0',poster:'p0',rug:'r0',lamp:'l0',plant:'n0'});

/* ============ STATE ============ */
function fresh(){const n=Date.now();return{
 v:2,t:n,look:null,app:null,name:TG_USER?TG_USER.first_name:'Выживший',
 sat:80,thr:80,en:100,hp:100,lvl:1,xp:0,caps:30,pts:0,
 res:{food:6,water:6,scrap:10,meds:2,parts:0},
 sh:{garden:0,rain:0,work:0,bunk:0,wall:0},
 col:{food:n,water:n,scrap:n},
 gear:{weapons:['fists'],armors:['rags'],w:'fists',a:'rags'},
 deco:{sh:DEF_DECO(),st:DEF_DECO()},
 owned:['w0','f0','p0','r0','l0','n0'],
 raids:0,kills:0,
 traits:[],sk:{scout:0,medic:0,mech:0,stalker:0,garden:0,wolf:0},sp:0,fun:80,comf:70,cd:{},cool:{},sleeping:false}}
let S=fresh(),sleeping=false,loading=true;
const hasT=id=>S.traits.includes(id);
const maxHp=()=>100+(S.lvl-1)*10-(hasT('frail')?20:0);
const WP=()=>WEAPONS.find(x=>x.id===S.gear.w);
const AR=()=>ARMORS.find(x=>x.id===S.gear.a);
const atk=()=>WP().atk+S.lvl+(hasT('strong')?2:0)+(hasT('stubborn')?1:0)+S.sk.wolf;
const def=()=>AR().def+S.sh.wall+S.sk.stalker;

function save(){if(loading)return;S.t=Date.now();if(FB)S.fight=FB;const s=JSON.stringify(S);try{localStorage.setItem(SAVE_KEY,s)}catch(e){}
 if(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')){try{TG.CloudStorage.setItem(SAVE_KEY,s)}catch(e){}}}
function load(cb){let local=null;try{local=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){}
 const fin=cloud=>{let b=local;if(cloud&&(!b||cloud.t>b.t))b=cloud;if(b){S=Object.assign(fresh(),b);if(b.fight&&b.fight.end==null)FB=b.fight;else FB=null;S.deco=Object.assign({sh:DEF_DECO(),st:DEF_DECO()},b.deco||{});if(S.look!=null&&!S.app)S.app={sex:'male',tone:'tan'};if(S.app&&!S.app.look)S.app.look=S.app.tone||'tan';S.sk=Object.assign(fresh().sk,b.sk||{});S.traits=b.traits||[];S.cd=b.cd||{};S.cool=b.cool||{}}cb()};
 if(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9')){try{TG.CloudStorage.getItem(SAVE_KEY,(e,v)=>{let c=null;try{c=JSON.parse(v)}catch(x){}fin(c);loading=false});return}catch(e){}}
 loading=false;fin(null)}

function tick(m){if(m<=0||loading)return;
 const hung=(hasT('glutton')?1.4:1)*(hasT('hardy')?.7:1);
 if(S.sleeping){S.en=clamp(S.en+m*(2+S.sh.bunk*.8)*(hasT('sleeper')?1.4:1),0,100);S.sat=clamp(S.sat-m*.08*hung,0,100);S.thr=clamp(S.thr-m*.1*hung,0,100);S.comf=clamp(S.comf+m*.4,0,100);if(S.en>=100){S.sleeping=false;toast('Выспался')}}
 else{S.sat=clamp(S.sat-m*.15*hung,0,100);S.thr=clamp(S.thr-m*.2*hung,0,100);S.en=clamp(S.en+m*.05,0,100);S.fun=clamp(S.fun-m*.12,0,100);S.comf=clamp(S.comf-m*.1*(hasT('smoker')?1.5:1),0,100)}
 if(S.sat<=0||S.thr<=0)S.hp=clamp(S.hp-m*.08,0,maxHp());else if(S.sat>40&&S.thr>40)S.hp=clamp(S.hp+m*.1,0,maxHp())}
function offline(){tick(Math.min((Date.now()-S.t)/60000,480))}
setInterval(()=>{tick(5/60);save();updHud()},5000);

/* ============ ECONOMY ============ */
const canPay=c=>Object.keys(c).every(k=>(k==='caps'||k==='pts'?S[k]:S.res[k])>=c[k]);
const pay=c=>{for(const k in c){if(k==='caps'||k==='pts')S[k]-=c[k];else S.res[k]-=c[k]}};
const costStr=c=>Object.keys(c).filter(k=>c[k]).map(k=>(k==='caps'?ic('caps'):k==='pts'?ic('star'):rI(k))+c[k]).join(' ');
function shCost(b){const l=S.sh[b.id],o={};for(const k in b.base)o[k]=Math.ceil(b.base[k]*Math.pow(1.7,l));return o}
function pend(k){const l={food:S.sh.garden,water:S.sh.rain,scrap:S.sh.work}[k];const m={food:3,water:3,scrap:2}[k];
 const h=Math.min((Date.now()-S.col[k])/3600000,8);return Math.floor(h*l*m*(k==='scrap'?1:1+.15*S.sk.garden))}

function doRaid(b,o){o=o||{};
 S.en-=raidCost(b);S.raids++;S.cool[b.id]=Date.now()+RESPAWN_MS;
 const log=[`<b>${b.n}</b> · настроение: ${moodInfo().txt}`];
 const zc=o.out?o.out.zs.length:b.d+rnd(1,3),mood=moodInfo().lv,pool=zPool(b),zs=o.out?o.out.zs:Array.from({length:zc},()=>pool[rnd(0,pool.length-1)]),lm=(mood==='cheerful'?1.15:mood==='grumpy'?.85:1)*(hasT('lucky')?1.2:1)*(o.quick?.7:1)*(o.out&&o.out.retreat?.6:1);let hp=o.out?o.out.hp:S.hp,dead=o.out?o.out.dead:false,kills=o.out?o.out.kills:0;
 if(!o.out)for(let z=0;z<zc&&!dead;z++){let zh=4+b.d*2;
  while(zh>0&&hp>0){zh-=atk()+rnd(0,3);if(zh>0)hp-=Math.max(1,b.d+rnd(0,2)-def()+(mood==='grumpy'?1:0))}
  if(hp>0)kills++;else dead=true}
 S.kills+=kills;const dmg=S.hp-Math.max(hp,0);S.hp=Math.max(hp,0);LASTRAID={zc,zs,kills,dead};
 log.push(`Убито: ${kills}/${zc} · урон −${Math.round(dmg)} HP`);
 if(o.out&&o.out.retreat)log.push('Отступил: добыча урезана до 60%');if(o.quick)log.push('Быстрая вылазка: добыча −30%');
 if(dead){S.hp=1;log.push('<span class="l">💀 Тебя чуть не прикончили. Еле дополз домой, добыча потеряна.</span>')}
 else{
  const got=[];
  for(const k in b.loot){const n=Math.round(rnd(b.loot[k][0],b.loot[k][1])*lm)+(k==='scrap'?Math.floor(S.sh.work/2)+S.sk.mech:0);if(n>0){S.res[k]+=n;got.push(rI(k)+n)}}
  const caps=rnd(1,3)*b.d,pts=b.d*4+kills;S.caps+=caps;S.pts+=pts;got.push(ic('caps')+caps);got.push(ic('star')+pts);
  log.push('<span class="w">Лут: '+got.join(' ')+'</span>');
  if(Math.random()<.18+b.d*.02){
   const isW=Math.random()<.5,t=Math.min(b.gt,rnd(Math.max(1,b.gt-1),b.gt));
   const it=(isW?WEAPONS:ARMORS).find(x=>x.t===t);
   if(it){const have=isW?S.gear.weapons:S.gear.armors;
    if(!have.includes(it.id)){have.push(it.id);log.push(`<span class="y">✨ Нашёл: ${it.n}! (смотри на складе)</span>`)}else{S.res.scrap+=5;log.push('Дубликат снаряжения → +5 '+ic('scrap'))}}}
  const xp=b.d*5;S.xp+=xp;log.push('+'+xp+' XP');
  while(S.xp>=S.lvl*30){S.xp-=S.lvl*30;S.lvl++;S.sp++;S.hp=maxHp();log.push(`<span class="y">⬆️ Уровень ${S.lvl}! +1 очко навыка</span>`)}
 }
 save();return log}

function shCreate(){const styles=['base',...LOOKIDS[CR.sex].filter(x=>!['light','tan','brown','dark'].includes(x))];
 return `<h3>Создай героя</h3><div class="sub">Имя:</div><input id="nm" maxlength="16" placeholder="Выживший" value="${(CR.name||'').replace(/"/g,'')}" oninput="CR.name=this.value">
 <div class="sub">Пол</div><div class="g2"><button class="${CR.sex==='male'?'p':''}" onclick="CR.sex='male';CR.style='base';refresh()">Мужчина</button><button class="${CR.sex==='female'?'p':''}" onclick="CR.sex='female';CR.style='base';refresh()">Женщина</button></div>
 <div class="sub">Внешность</div><div class="g3">${styles.map(id=>`<button class="lk ${CR.style===id?'p':''}" onclick="CR.style='${id}';refresh()"><img src="assets/heroes/hero_${CR.sex}_${id==='base'?CR.tone:id}.png" alt=""><span>${id==='base'?'Классика':LOOKNAME[id]}</span></button>`).join('')}</div>
 ${CR.style==='base'?`<div class="sub">Цвет кожи</div><div class="g2">${TONES.map(t=>`<button class="${CR.tone===t[0]?'p':''}" onclick="CR.tone='${t[0]}';refresh()"><span class="sw" style="background:${t[2]}"></span>${t[1]}</button>`).join('')}</div>`:''}
 <div class="sub">Черты характера. Очков: <b>${crBal()}</b>. Сильные стороны покупаются за счёт слабостей (до 3 и 3).</div>
 ${TRAITS.map(t=>`<div class="it"><div>${t.n}<small>${t.d}</small></div><button class="${CR.traits.includes(t.id)?'p':''}" ${crCan(t.id)?'':'disabled'} onclick="crTrait('${t.id}')">${CR.traits.includes(t.id)?'✓':(t.v>0?'+'+t.v:'−'+(-t.v))}</button></div>`).join('')}
 <button class="p" style="width:100%;margin-top:8px" onclick="startGame()">Начать игру</button>`}
function shHome(){return `<h3>🏠 Убежище</h3><div class="sub">Улучшения и сбор ресурсов</div>`+SHELTER.map(b=>`<div class="it"><div>${b.i} ${b.n} <span class="tag">ур.${S.sh[b.id]}/${b.max}</span><small>${b.desc}</small></div><button onclick="openS(shBuilding,'${b.id}')">Открыть</button></div>`).join('')}
function startGame(){const v=(CR.name||'').trim();S.look=0;S.app={sex:CR.sex,look:crLook()};S.traits=CR.traits.slice();S.name=v||'Выживший';S.fun=80;S.comf=70;S.hp=maxHp();closeSheet();HERO.x=90;HERO.y=262;HERO.tx=90;HERO.ty=262;save();setScene('shelter');haptic()}

/* ============ SCENE CONTROL / HUD ============ */
const NB=(l,i,o,c='')=>`<button class="nb${c}" onclick="${o}"><span>${i}</span>${l}</button>`;
function setScene(s){scene=s;closeSheet();
 const bar=$('bar');
 if(s==='shelter')bar.innerHTML=NB('Тамбур','🚪',"setScene('hall')")+NB('Убежище','🏠','openS(shHome)')+NB('Герой','🧍','openS(shNeeds)',' hot');
 else if(s==='hall')bar.innerHTML=NB('Комната','⬅️',"setScene('shelter')")+NB('Герой','🧍','openS(shNeeds)',' hot');
 else if(s==='storage')bar.innerHTML=NB('Тамбур','⬅️',"setScene('hall')")+NB('Герой','🧍','openS(shNeeds)',' hot');
 else if(s==='city')bar.innerHTML=NB('Домой','🏠',"setScene('hall')")+NB('Герой','🧍','openS(shNeeds)',' hot');
 else bar.innerHTML='';
 if(s==='create')openS(shCreate);
 if(DEV&&['shelter','hall','storage','city'].includes(s))bar.insertAdjacentHTML('beforeend','<button class="nb dev" onclick="openS(shDev)"><span>🛠</span></button>');
 if(s==='shelter'||s==='hall'||s==='storage'){HERO.x=HERO.tx=s==='hall'?104:90;HERO.y=HERO.ty=262}
 $('hint').textContent=s==='city'?'Тащи карту · тапни здание, чтобы идти в вылазку':'';
 if(s==='city'){cam.x=(WW-VW)/2;cam.y=0}
 updHud()}
function updHud(){const h=$('hud');if(scene==='create'){h.innerHTML='';return}
 const m=moodInfo(),u=(v,c)=>`<i><u style="width:${clamp(v,0,100)}%;background:${c}"></u></i>`;
 h.innerHTML=`<div class="hr"><span><img class="ic" style="width:16px;height:16px" src="assets/icons/icon_mood_${m.lv}.png" alt=""> ${S.name} · ур.${S.lvl}</span><span>${ic('caps')}${S.caps} &nbsp;${ic('star')}${S.pts}</span></div>
 <div class="hb">${u(S.hp/maxHp()*100,'#e5534b')}${u(S.sat,'#e3b341')}${u(S.thr,'#58a6ff')}${u(S.en,'#7ed957')}${u(S.fun,'#b88cff')}${u(S.comf,'#e08a3c')}</div>
 <div class="hres">${ic('food')}${S.res.food} ${ic('water')}${S.res.water} ${ic('scrap')}${S.res.scrap} ${ic('medkit')}${S.res.meds} ${ic('parts')}${S.res.parts}</div>`}

/* ============ INPUT ============ */
let ptr=null;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(x){}ptr={x0:e.clientX,y0:e.clientY,cx:cam.x,cy:cam.y,moved:false}});
cv.addEventListener('pointermove',e=>{if(!ptr)return;const dx=e.clientX-ptr.x0,dy=e.clientY-ptr.y0;if(Math.abs(dx)+Math.abs(dy)>6)ptr.moved=true;
 if(scene==='city'&&ptr.moved&&!RA){cam.x=clamp(ptr.cx-dx/SC,0,WW-VW);cam.y=clamp(ptr.cy-dy/SC,0,WH-VH)}});
cv.addEventListener('pointerup',e=>{if(!ptr)return;const p=ptr;ptr=null;if(p.moved)return;const r=cv.getBoundingClientRect();tap((e.clientX-r.left)/SC,(e.clientY-r.top)/SC)});
function tap(x,y){if(scene==='create'&&!cur){openS(shCreate);return}if(cur)return;if(scene==='fight'){fightTap(x,y);return}haptic();
 if(scene==='city'){if(RA)return;const wx=x+Math.round(cam.x),wy=y+Math.round(cam.y);
  for(const b of POIS)if(Math.abs(wx-b.x)<=14&&wy>=b.y-30&&wy<=b.y+16){if(S.lvl<b.dist.lvl)return toast('Район закрыт: нужен уровень '+b.dist.lvl);return openS(shPOI,b.id)}return}
 let hit=null;for(let i=HS.length-1;i>=0;i--){const h=HS[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){hit=h.id;break}}
 if((scene==='shelter'||scene==='hall'||scene==='storage')&&!S.sleeping&&!hit&&y>=curFloor().y0-6&&y<=curFloor().y1+4){const F=curFloor();HERO.tx=clamp(x,F.x0,F.x1);HERO.ty=clamp(y,F.y0,F.y1);return}
 if(!hit)return;
 if(scene==='hall'){
  if(hit==='char')return openS(shNeeds);
  if(hit==='vault'){HERO.tx=HERO.x=104;HERO.ty=HERO.y=262;return setScene('city')}
  if(hit==='doorstore'){HERO.tx=HERO.x=40;HERO.ty=HERO.y=262;return setScene('storage')}
  if(hit==='lockerh')return toast('Пустые шкафы, пока ничего нет');
  if(hit==='coat')return toast('Старое пальто. Пригодится для одежды позже');return}
 if(scene==='shelter'){
  const walkTo=(tx,ty)=>{if(!sleeping){HERO.tx=tx;HERO.ty=ty}};
  if(hit==='char')return openS(shNeeds);
  if(hit==='bunk'){walkTo(112,226);return openS(shBuilding,'bunk')}
  if(hit==='desk'){walkTo(66,224);return openS(shBuilding,'work')}
  if(hit==='window')return openS(shBuilding,'wall');
  if(hit==='locker'){walkTo(150,240);return openS(shWard)}
  if(hit==='shelf')return doFun('read');if(hit==='radio')return doFun('radio');if(hit==='radiator')return doFun('warm')}
 else if(scene==='storage'){
  if(hit==='ward')return openS(shWard);if(hit==='rack')return openS(shRack);if(hit==='stock')return openS(shStock);
  if(hit==='char')return openS(shNeeds);if(['poster','rug','lamp','plant'].includes(hit))return openS(shDeco,hit)}}

/* ============ LOOP ============ */
let last=performance.now();
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;time+=dt;
 for(const z of SZ){z.x+=z.d*dt*4;if(z.x<4||z.x>170)z.d*=-1}
 updChar(dt);updHero(dt);ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=false;
 if(scene==='create')drawCreate();else if(scene==='shelter')drawShelter();else if(scene==='hall')drawHall();else if(scene==='storage')drawStorage();else if(scene==='city')drawCity(dt);else if(scene==='battle')drawBattle(dt);else if(scene==='fight')drawFight(dt);
 drawFX(dt);flushText();requestAnimationFrame(frame)}

const boot=()=>load(()=>{offline();CH.y=floorY(0);CH.x=60;if(S.app==null)setScene('create');else setScene('shelter');updHud();requestAnimationFrame(frame)});
if(RESET)wipeSave(boot);else boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){offline();S.t=Date.now();updHud()}});
</script>
</body>
</html>
